[project]
name = "shawlynot-quant"
version = "0.1.0"
description = "Crypto Vol Platform — vol fitting, pricing, and Greeks"
readme = "README.md"
authors = [
    { name = "shawlynot", email = "88781957+shawlynot@users.noreply.github.com" }
]
requires-python = ">=3.14.3"
dependencies = [
    "psycopg[binary]>=3.2",
    "polars>=1.0",
    "httpx>=0.27",
]

[project.scripts]
deribit-reference-ingest = "shawlynot.quant.deribit.reference_ingest:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# The distribution is shawlynot-quant but the import path is shawlynot.quant,
# so the module name has to be spelled out; namespace = true keeps
# src/shawlynot/ an implicit (PEP 420) package with no __init__.py.
[tool.uv.build-backend]
module-name = "shawlynot.quant"
namespace = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# shawlynot is an implicit namespace package, so there is no __init__.py to
# anchor the module path -- mypy needs src/ named as the package base or it
# resolves shawlynot/quant/foo.py to the module "foo".
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
